<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meta Quest 3 AR Projesi</title>
    
    <!-- Google Model Viewer Kütüphanesi -->
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    
    <style>
        /* Sayfa Tasarımı ve Tam Ekran Ayarları */
        body { 
            margin: 0; 
            padding: 0; 
            background-color: #f0f0f0; 
            overflow: hidden; 
            width: 100vw; 
            height: 100vh; 
        }
        
        model-viewer { 
            width: 100%; 
            height: 100%; 
        }
        
        /* Yükleme Çubuğu (Progress Bar) Tasarımı */
        .progress-bar {
            display: block; 
            width: 50%; 
            max-width: 300px; 
            height: 10px;
            position: absolute; 
            top: 50%; 
            left: 50%; 
            transform: translate(-50%, -50%);
            background-color: rgba(0, 0, 0, 0.2); 
            border-radius: 25px;
        }
        
        .update-bar {
            background-color: #4CAF50; 
            width: 0%; 
            height: 100%;
            border-radius: 25px; 
            transition: width 0.3s;
        }
        
        /* AR Butonu Tasarımı */
        .ar-button {
            background-color: #ffffff; 
            border-radius: 8px; 
            border: 2px solid #333;
            position: absolute; 
            bottom: 30px; 
            left: 50%; 
            transform: translateX(-50%);
            padding: 12px 24px; 
            font-size: 16px; 
            font-weight: bold; 
            cursor: pointer;
            box-shadow: 0px 4px 6px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <!-- 3D Model ve AR Ayarları -->
    <model-viewer
        id="ar-model"
        src="model.glb"
        ar
        ar-modes="webxr"
        camera-controls
        touch-action="none"
        shadow-intensity="1">
        
        <!-- Yükleme Çubuğu HTML Kısmı -->
        <div class="progress-bar" slot="progress-bar">
            <div class="update-bar"></div>
        </div>

        <!-- Kendi Özel AR Butonumuz -->
        <button slot="ar-button" class="ar-button">
            AR ile Gör
        </button>
    </model-viewer>

    <!-- Yükleme Çubuğunu Çalıştıran JavaScript Kodu -->
    <script>
        const modelViewer = document.querySelector('#ar-model');
        const progress = document.querySelector('.update-bar');
        const progressBar = document.querySelector('.progress-bar');

        // Yükleme sırasında çubuğun genişliğini (width) artırır
        modelViewer.addEventListener('progress', (event) => {
            const yuzde = event.detail.totalProgress * 100;
            progress.style.width = yuzde + '%';
        });

        // Model tamamen yüklendiğinde çubuğu kesin olarak gizler
        modelViewer.addEventListener('load', () => {
            progressBar.style.display = 'none';
        });
    </script>
</body>
</html>
